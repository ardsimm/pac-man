[project]
name = "pac-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mazegenerator",
    "numpy>=2.2.6",
    "pillow==13.0.0",
    "pydantic>=2.14.1",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = ["mazegenerator", "mazegenerator.*"]
follow_untyped_imports = true
